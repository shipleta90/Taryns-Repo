<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agent">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>Agent</title>
</head>
<body>
  <header>
    <h1 id="title">Briefing</h1>
    <span id="mode" class="pill"></span>
  </header>

  <nav class="tabs">
    <button id="tab-briefing" class="tab active" data-tab="briefing">Briefing</button>
    <button id="tab-inbox" class="tab" data-tab="inbox">Inbox</button>
  </nav>

  <main id="view-briefing">
    <section class="card">
      <p id="overview" class="overview">Loading…</p>
      <div id="bsummary" class="summary"></div>
      <div class="row"><button id="brefresh" class="secondary">Refresh briefing</button></div>
      <p id="bnote" class="notice" hidden></p>
    </section>
    <div id="todo-wrap" hidden>
      <h2>To do</h2>
      <ul id="todo" class="list"></ul>
    </div>
    <div id="sections"></div>
  </main>

  <main id="view-inbox" hidden>
    <section class="card">
      <div id="summary" class="summary">Loading…</div>
      <div class="row">
        <button id="dry" class="secondary">Preview run</button>
        <button id="real" class="danger">Run for real</button>
      </div>
      <p id="notice" class="notice" hidden></p>
    </section>

    <h2>Recent actions</h2>
    <ul id="actions" class="list"></ul>
  </main>

  <dialog id="login">
    <form method="dialog" id="loginForm">
      <h2>Connect</h2>
      <p>Enter the AGENT_TOKEN from your Mac mini.</p>
      <input id="tokenInput" type="password" autocomplete="current-password" required>
      <button>Save</button>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
